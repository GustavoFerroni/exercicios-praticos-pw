<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>classificador de dia da semana</title>
    <style>
        body { font-family: Arial; }
    </style>
</head>
<body>

    <h3>6. Classificador de Dia da Semana</h3>

    <input id="dia" type="number" placeholder="Digite um número de 1 a 7">
    <button onclick="verificar()">Mostrar Dia</button>

    <p id="resultado"></p>

    <script>
        function nomeDoDia(n) {
            switch (n) {
                case 1: return "Domingo";
                case 2: return "Segunda";
                case 3: return "Terça";
                case 4: return "Quarta";
                case 5: return "Quinta";
                case 6: return "Sexta";
                case 7: return "Sábado";
                default: return "Número inválido";
            }
        }

        function verificar() {
            let n = Number(document.getElementById("dia").value);
            document.getElementById("resultado").innerText = nomeDoDia(n);
        }
    </script>

</body>
</html>
