<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>tipo de triângulo</title>
    <style>
        body { font-family: Arial; }
    </style>
</head>
<body>

    <h3>7. Tipo de Triângulo</h3>

    <input id="l1" type="number" placeholder="Lado 1"><br>
    <input id="l2" type="number" placeholder="Lado 2"><br>
    <input id="l3" type="number" placeholder="Lado 3"><br><br>

    <button onclick="verificar()">Ver Tipo</button>

    <p id="resultado"></p>

    <script>
        function tipoTriangulo(a, b, c) {
            if (a === b && b === c) {
                return "Equilátero";
            } else if (a === b || a === c || b === c) {
                return "Isósceles";
            } else {
                return "Escaleno";
            }
        }

        function verificar() {
            let a = Number(document.getElementById("l1").value);
            let b = Number(document.getElementById("l2").value);
            let c = Number(document.getElementById("l3").value);

            document.getElementById("resultado").innerText = tipoTriangulo(a, b, c);
        }
    </script>

</body>
</html>
